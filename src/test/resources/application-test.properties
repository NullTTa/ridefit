# 테스트에서는 실제 MySQL 대신 인메모리 H2를 사용해서, DB 접속 정보 없이도
# @SpringBootTest 컨텍스트 로딩과 통합 테스트를 돌릴 수 있게 한다.
spring.datasource.url=jdbc:h2:mem:ridefit-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-secret-key-not-for-production-0123456789
jwt.expiration-ms=86400000

ai.synth.mode=mock
