spring.profiles.active=local

# AI_SYNTH_MODE=mock|live. 기본은 mock이며, live로 바꾸기 전까지는 실제 API를 호출하지 않는다.
ai.synth.mode=${AI_SYNTH_MODE:mock}
pollinations.api-key=${POLLINATIONS_API_KEY:}
gemini.api-key=${GEMINI_API_KEY:}

# "AI로 장착해보기"(FitRoom) - OpenAI Image API(이미지 편집). 키는 환경변수 OPENAI_API_KEY로만 넣는다(코드/깃 금지).
# 키가 없으면 AI 버튼만 비활성화되고 기존 2D FitRoom은 그대로 동작한다.
# 모델/품질은 공식 문서의 현재 모델을 확인해 환경변수로 바꿀 수 있다(코드 수정 불필요).
openai.api-key=${OPENAI_API_KEY:}
openai.image.model=${OPENAI_IMAGE_MODEL:gpt-image-2.5-sunburst}
openai.image.quality=${OPENAI_IMAGE_QUALITY:medium}
openai.image.timeout-seconds=${OPENAI_IMAGE_TIMEOUT_SECONDS:180}
# 서비스 전체 하루 최대 생성 횟수(캐시 재사용은 제외). 회원별 한도(하루 20회, 링크 가져오기와 합산)와 별개.
openai.image.daily-limit=${OPENAI_IMAGE_DAILY_LIMIT:30}

# "AI로 장착해보기"에 쓸 이미지 API: auto(기본) | openai | gemini | magichour
#  auto = OPENAI_API_KEY가 있으면 OpenAI, 없고 GEMINI_API_KEY가 있으면 Gemini, 둘 다 없고 MAGICHOUR_API_KEY가 있으면 Magic Hour.
#  키가 하나도 없으면 AI 버튼만 비활성화된다.
# Gemini 키는 위의 gemini.api-key(환경변수 GEMINI_API_KEY)로만 넣는다(코드/깃 금지).
ai.fit.provider=${AI_FIT_PROVIDER:auto}
gemini.image.model=${GEMINI_IMAGE_MODEL:gemini-2.5-flash-image}
gemini.image.timeout-seconds=${GEMINI_IMAGE_TIMEOUT_SECONDS:180}

# Magic Hour AI Image Editor. 키는 MAGICHOUR_API_KEY로만 넣는다(이 파일에 실제 키 금지 - application-local.properties에 넣을 것).
# 모델은 flux-2-klein(가장 저렴) 외에 qwen-edit, nano-banana 등으로 바꿀 수 있다. 결과는 항상 1장만 요청한다.
# 차량/부품 이미지가 Magic Hour 서버로 업로드된다. 실패/시간 초과 시 자동 재요청하지 않는다.
magichour.api-key=${MAGICHOUR_API_KEY:}
magichour.image.model=${MAGICHOUR_IMAGE_MODEL:flux-2-klein}
magichour.image.resolution=${MAGICHOUR_IMAGE_RESOLUTION:640px}
magichour.image.timeout-seconds=${MAGICHOUR_IMAGE_TIMEOUT_SECONDS:180}
magichour.image.poll-interval-seconds=${MAGICHOUR_IMAGE_POLL_INTERVAL_SECONDS:3}

app.upload-dir=${UPLOAD_DIR:uploads}
# 차종/부품 기본 이미지(/assets/...)가 있는 프론트엔드 public 폴더 - AI 합성 때 서버가 원본 이미지를 읽는다.
app.frontend-public-dir=${FRONTEND_PUBLIC_DIR:frontend/public}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
